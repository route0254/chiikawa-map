<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ちいかわ公式関連スポットや、ナガノ先生が紹介・訪問したスポットをまとめる非公式推し活マップです。"
  >

  <title>ちいかわ推し活MAP</title>


  <!-- ==============================
       Leaflet CSS
       ============================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >


  <!-- ==============================
       自作CSS
       ============================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- ==============================
       ヘッダー
       ============================== -->

  <header class="site-header">

    <h1>
      ちいかわ推し活MAP
    </h1>

    <p>
      ちいかわ公式関連スポットや、
      ナガノ先生が紹介・訪問したスポットをまとめる
      非公式ファンサイトです。
    </p>

  </header>


  <!-- ==============================
       フィルター
       ============================== -->

  <section
    class="map-controls"
    aria-label="スポット表示フィルター"
  >

    <div class="map-controls-title">
      表示するスポット
    </div>


    <!-- ちいかわ公式 -->

    <label class="filter-option">

      <input
        type="checkbox"
        id="filter-official"
        checked
      >

      <span
        class="filter-dot official-dot"
        aria-hidden="true"
      ></span>

      <span>
        ちいかわ公式関連
      </span>

    </label>


    <!-- ナガノ先生 -->

    <label class="filter-option">

      <input
        type="checkbox"
        id="filter-nagano"
        checked
      >

      <span
        class="filter-dot nagano-dot"
        aria-hidden="true"
      ></span>

      <span>
        ナガノ先生関連
      </span>

    </label>

  </section>


  <!-- ==============================
       メイン
       ============================== -->

  <main>

    <div id="map-wrapper">


      <!-- Leaflet地図 -->

      <div
        id="map"
        aria-label="ちいかわ推し活マップ"
      ></div>


      <!--
        地図サービス障害時などの
        ステータスメッセージ
      -->

      <div
        id="map-status"
        role="status"
        aria-live="polite"
        hidden
      ></div>


    </div>

  </main>


  <!-- ==============================
       Leaflet JavaScript
       ============================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>


  <!-- ==============================
       自作JavaScript
       ============================== -->

  <script src="app.js"></script>


</body>

</html>
