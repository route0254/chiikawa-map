<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="ちいかわ公式関連スポットや、ナガノ先生が紹介・訪問したスポットをまとめる非公式推し活マップです。"
  >

  <title>ちいかわ推し活MAP</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- ========================================
       ヘッダー
       ======================================== -->

  <header class="site-header">

    <div class="site-header-inner">

      <div class="site-header-top">

        <span class="site-kicker">
          OSHIKATSU MAP
        </span>

        <span class="unofficial-badge">
          非公式ファンサイト
        </span>

      </div>

      <h1>
        ちいかわ推し活MAP
      </h1>

      <p class="site-description">
        ちいかわ公式関連スポットや、
        ナガノ先生が紹介・訪問した場所をまとめています。
      </p>

    </div>

  </header>


  <!-- ========================================
       ページ本体
       ======================================== -->

  <main class="page-shell">


    <!-- ========================================
         マップカード
         ======================================== -->

    <section class="map-card">


      <!-- ========================================
           ツールバー
           ======================================== -->

      <div class="map-toolbar">

        <div class="map-toolbar-left">

          <button
            type="button"
            class="filter-button"
            id="filter-toggle"
            aria-expanded="false"
            aria-controls="filter-panel"
          >
            <span aria-hidden="true">
              ☰
            </span>

            絞り込み
          </button>


          <span
            id="result-count"
            class="result-count"
          >
            読み込み中…
          </span>

        </div>


        <div class="map-legend">

          <span class="legend-item">

            <span
              class="legend-dot official-dot"
            ></span>

            公式

          </span>


          <span class="legend-item">

            <span
              class="legend-dot nagano-dot"
            ></span>

            ナガノ先生

          </span>

        </div>

      </div>


      <!-- ========================================
           地図＋詳細
           ======================================== -->

      <div
        class="map-content"
        id="map-content"
      >


        <!-- ========================================
             地図エリア
             ======================================== -->

        <div id="map-wrapper">


          <!-- フィルターパネル -->

          <aside
            id="filter-panel"
            class="filter-panel"
            hidden
          >

            <div class="filter-panel-header">

              <div>

                <div class="filter-panel-kicker">
                  FILTER
                </div>

                <h2>
                  スポットを絞り込む
                </h2>

              </div>


              <button
                type="button"
                class="icon-button"
                id="filter-close"
                aria-label="絞り込みを閉じる"
              >
                ×
              </button>

            </div>


            <div class="filter-panel-body">


              <!-- 関連 -->

              <fieldset class="filter-group">

                <legend>
                  関連
                </legend>


                <div class="filter-chip-list">

                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-category"
                      value="official"
                      checked
                    >

                    <span>
                      ちいかわ公式
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-category"
                      value="nagano"
                      checked
                    >

                    <span>
                      ナガノ先生
                    </span>

                  </label>

                </div>

              </fieldset>


              <!-- スポット種類 -->

              <fieldset class="filter-group">

                <legend>
                  スポットの種類
                </legend>


                <div class="filter-chip-list">

                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-place"
                      value="shop"
                      checked
                    >

                    <span>
                      ショップ
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-place"
                      value="food"
                      checked
                    >

                    <span>
                      グルメ
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-place"
                      value="spot"
                      checked
                    >

                    <span>
                      おでかけ
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-place"
                      value="lodging"
                      checked
                    >

                    <span>
                      宿泊
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-place"
                      value="other"
                      checked
                    >

                    <span>
                      その他
                    </span>

                  </label>

                </div>

              </fieldset>


              <!-- 公式関連 -->

              <details
                class="filter-details"
                open
              >

                <summary>
                  ちいかわ公式関連の種類
                </summary>


                <div class="filter-chip-list filter-chip-list-inner">

                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-official-relation"
                      value="official_store"
                      checked
                    >

                    <span>
                      公式ショップ
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-official-relation"
                      value="official_facility"
                      checked
                    >

                    <span>
                      公式施設
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-official-relation"
                      value="collaboration"
                      checked
                    >

                    <span>
                      コラボ
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-official-relation"
                      value="popup"
                      checked
                    >

                    <span>
                      POP UP
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-official-relation"
                      value="event"
                      checked
                    >

                    <span>
                      イベント・展示
                    </span>

                  </label>

                </div>

              </details>


              <!-- ナガノ先生関連 -->

              <details class="filter-details">

                <summary>
                  ナガノ先生関連の種類
                </summary>


                <div class="filter-chip-list filter-chip-list-inner">

                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-nagano-relation"
                      value="introduced"
                      checked
                    >

                    <span>
                      紹介
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-nagano-relation"
                      value="visited"
                      checked
                    >

                    <span>
                      訪問
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-nagano-relation"
                      value="related"
                      checked
                    >

                    <span>
                      ゆかり・関連
                    </span>

                  </label>

                </div>

              </details>


              <!-- 開催期間 -->

              <fieldset class="filter-group">

                <legend>
                  開催期間
                </legend>


                <div class="filter-chip-list">

                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-period"
                      value="permanent"
                      checked
                    >

                    <span>
                      常設
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-period"
                      value="limited"
                      checked
                    >

                    <span>
                      期間限定
                    </span>

                  </label>

                </div>

              </fieldset>


              <!-- 予約 -->

              <fieldset class="filter-group">

                <legend>
                  予約
                </legend>


                <div class="filter-chip-list">

                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-reservation"
                      value="not_available"
                      checked
                    >

                    <span>
                      予約不可
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-reservation"
                      value="optional"
                      checked
                    >

                    <span>
                      予約可
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-reservation"
                      value="priority"
                      checked
                    >

                    <span>
                      予約優先
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-reservation"
                      value="required"
                      checked
                    >

                    <span>
                      要予約
                    </span>

                  </label>


                  <label class="filter-chip">

                    <input
                      class="spot-filter"
                      type="checkbox"
                      name="filter-reservation"
                      value="unknown"
                      checked
                    >

                    <span>
                      要確認
                    </span>

                  </label>

                </div>

              </fieldset>

            </div>


            <div class="filter-panel-footer">

              <button
                type="button"
                class="secondary-button"
                id="filter-reset"
              >
                すべて表示に戻す
              </button>

            </div>

          </aside>


          <!-- Leaflet地図 -->

          <div
            id="map"
            aria-label="ちいかわ推し活マップ"
          ></div>


          <!-- 障害時メッセージ -->

          <div
            id="map-status"
            role="status"
            aria-live="polite"
            hidden
          ></div>

        </div>


        <!-- ========================================
             スポット詳細
             ======================================== -->

        <aside
          id="spot-detail-panel"
          class="spot-detail-panel"
          hidden
        >

          <div class="spot-detail-header">

            <span class="spot-detail-kicker">
              SPOT INFO
            </span>


            <button
              type="button"
              id="detail-close"
              class="icon-button"
              aria-label="スポット詳細を閉じる"
            >
              ×
            </button>

          </div>


          <div
            id="spot-detail-body"
            class="spot-detail-body"
          ></div>

        </aside>


      </div>

    </section>


    <p class="site-note">
      掲載情報は変更される場合があります。
      営業時間・入場方法などは各公式情報もあわせてご確認ください。
    </p>

  </main>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js"></script>

</body>

</html>
