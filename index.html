<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ちいかわ推し活MAP</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <!-- 自作CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>ちいかわ推し活MAP</h1>
    <p>
      ちいかわ関連スポットや、
      ナガノ先生が紹介したスポットをまとめる非公式ファンサイトです。
    </p>
  </header>

<section class="map-controls">

  <div class="map-controls-title">
    表示するスポット
  </div>

  <label class="filter-option">

    <input
      type="checkbox"
      id="filter-official"
      checked
    >

    <span class="filter-dot official-dot"></span>

    ちいかわ公式関連

  </label>

  <label class="filter-option">

    <input
      type="checkbox"
      id="filter-nagano"
      checked
    >

    <span class="filter-dot nagano-dot"></span>

    ナガノ先生関連

  </label>

</section>
  
  <main>
    <div id="map-wrapper">

      <div id="map"></div>

      <div
        id="map-status"
        role="status"
        aria-live="polite"
        hidden
      ></div>

    </div>
  </main>

  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- 自作JavaScript -->
  <script src="app.js"></script>

</body>

</html>
