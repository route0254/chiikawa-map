name: 閉店・移転・開催終了の報告
description: 掲載スポットの閉店、移転、開催終了を報告します
title: "[終了・移転] "
body:
  - type: input
    id: spot-id
    attributes:
      label: スポットID
      placeholder: 不明な場合は「不明」
    validations:
      required: true

  - type: input
    id: spot-name
    attributes:
      label: スポット名
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 状況
      options:
        - 閉店
        - 移転
        - 開催終了
        - 長期休業
        - その他
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: 終了・移転日
      description: 不明な場合は「不明」とご記入ください。
    validations:
      required: true

  - type: input
    id: evidence-url
    attributes:
      label: 確認できる公式情報のURL
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 補足
      description: 移転先など、追加情報があればご記入ください。
