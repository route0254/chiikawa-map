name: Validate spot data

on:
  push:
    branches:
      - main
    paths:
      - "data/*.json"
      - "scripts/validate-data.mjs"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/*.json"
      - "scripts/validate-data.mjs"
      - ".github/workflows/validate-data.yml"
  schedule:
    - cron: "23 6 * * 1"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate spot data
        run: node scripts/validate-data.mjs
