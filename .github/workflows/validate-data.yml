name: Validate spot data

on:
  push:
    branches:
      - main
    paths:
      - "data/*.json"
      - "scripts/validate-data.mjs"
      - "scripts/validate-collaborations.mjs"
      - "scripts/report-status-candidates.mjs"
      - "scripts/build-spot-pages.mjs"
      - "spot/**"
      - ".spot-pages-manifest.json"
      - "sitemap.xml"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/*.json"
      - "scripts/validate-data.mjs"
      - "scripts/validate-collaborations.mjs"
      - "scripts/report-status-candidates.mjs"
      - "scripts/build-spot-pages.mjs"
      - "spot/**"
      - ".spot-pages-manifest.json"
      - "sitemap.xml"
      - ".github/workflows/validate-data.yml"
  schedule:
    - cron: "23 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate spot data
        run: node scripts/validate-data.mjs

      - name: Validate collaboration data
        run: node scripts/validate-collaborations.mjs

      - name: Verify generated spot pages
        run: node scripts/build-spot-pages.mjs --check

      - name: Report official spot status
        run: node scripts/report-status-candidates.mjs --github-summary --fail-on-archive-candidates
