<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="robots" content="noindex, follow">
  <meta
    name="description"
    content="ちいかわ推し活（ちい活）MAPのページが見つかりません。"
  >

  <title>ページが見つかりません | ちいかわ推し活（ちい活）MAP</title>

  <link
    rel="icon"
    href="/favicon.svg"
    type="image/svg+xml"
  >

  <style>
    :root {
      color-scheme: light;
      font-family:
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: #4f4350;
      background: #fff7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #ffe4f0 0, transparent 38%),
        radial-gradient(circle at bottom right, #dcf8ef 0, transparent 38%),
        #fff7fb;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 56px);
      text-align: center;
      border: 1px solid #f3cbdc;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 48px rgba(139, 92, 123, 0.14);
    }

    .brand {
      margin: 0 0 14px;
      color: #c75f8b;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .code {
      margin: 0;
      color: #d96698;
      font-size: clamp(3.5rem, 16vw, 6rem);
      font-weight: 900;
      line-height: 1;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(1.35rem, 6vw, 2rem);
    }

    p {
      margin: 0;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 28px;
      padding: 11px 22px;
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
      background: #d96698;
      box-shadow: 0 8px 20px rgba(217, 102, 152, 0.25);
    }

    a:hover,
    a:focus-visible {
      background: #bd4d7d;
    }

    a:focus-visible {
      outline: 3px solid #7cdac0;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <p class="brand">CHIIKATSU MAP</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>ページが見つかりません</h1>
    <p>
      URLが変更されたか、ページが削除された可能性があります。<br>
      ちい活マップのトップから、スポットを探し直してください。
    </p>
    <a href="/">ちい活マップへ戻る</a>
  </main>
</body>

</html>
