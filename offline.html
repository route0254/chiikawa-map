<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f477a8">
  <title>オフラインです｜ちい活MAP</title>
  <style>
    :root { font-family: "Zen Maru Gothic", system-ui, sans-serif; color: #51444b; background: #fffafd; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(520px, 100%); padding: 34px; border: 1px solid #f0dce6; border-radius: 24px; background: #fff; box-shadow: 0 18px 45px rgba(91, 62, 77, .11); text-align: center; }
    .icon { display: grid; place-items: center; width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 24px; background: #fff0f6; font-size: 36px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0; line-height: 1.8; }
    button { min-height: 46px; margin-top: 22px; padding: 10px 22px; border: 0; border-radius: 999px; color: #fff; background: #e65f95; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">☁</div>
    <h1>いまはオフラインのようです</h1>
    <p>通信が戻ったら、もう一度お試しください。以前開いたページや保存済みデータは、端末の状態により利用できる場合があります。</p>
    <button type="button" onclick="location.reload()">もう一度読み込む</button>
  </main>
</body>
</html>
